name: 平和島データ自動取得

on:
  schedule:
    - cron: "0 23 * * *"  # 08:00 JST (出走表確定後)
    - cron: "0 1 * * *"   # 10:00 JST (1-2R展示後)
    - cron: "0 3 * * *"   # 12:00 JST (3-5R展示後)
    - cron: "0 5 * * *"   # 14:00 JST (6-8R展示後)
    - cron: "0 7 * * *"   # 16:00 JST (9-10R展示後)
    - cron: "0 9 * * *"   # 18:00 JST (11-12R展示後)
  workflow_dispatch:
    # 手動実行ボタンも有効化

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: 依存関係インストール
        run: pip install -r scraper/requirements.txt

      - name: 今日のレースデータを取得
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper/scrape.py
